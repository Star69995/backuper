[package]
name = "backuper"
version = "0.3.8"
edition = "2021"
license = "GPL-3.0-only"

[lib]
name = "backuper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
regex = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2.12.1", features = ["tray-icon"] }
tauri-plugin-autostart = "2.7.0"
tauri-plugin-dialog = "2.8.1"
tauri-plugin-notification = "2.5.1"
tauri-plugin-single-instance = "2.5.2"
tauri-plugin-updater = "2"
uuid = { version = "1.26.1", features = ["v4"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
